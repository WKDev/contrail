<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121826"/>
      <stop offset="1" stop-color="#0d1118"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.025"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a8bff"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ddc84"/>
    </marker>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>

  <!-- 단계 번호 공통 스타일 -->
  <g font-size="14" font-weight="700" fill="#7f8aa0" letter-spacing="1.5">
    <text x="56" y="56">1  SD 카드</text>
    <text x="356" y="56">2  비행으로 묶기 · 병합</text>
    <text x="676" y="56">3  HUD · 고글 OSD 합성</text>
    <text x="1006" y="56">4  완성</text>
  </g>

  <!-- 1. 드론 클립 -->
  <g transform="translate(40 76)">
    <rect width="260" height="196" rx="20" fill="url(#card)" stroke="#fff" stroke-opacity="0.12"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" fill="#c4cbd8">
      <rect x="20" y="22" width="220" height="34" rx="9" fill="#2f5bd8" fill-opacity="0.35" stroke="#5a8bff" stroke-opacity="0.6"/>
      <text x="34" y="44">DJI_…_0021_D.MP4</text><text x="226" y="44" text-anchor="end" fill="#8fb0ff">7:40</text>
      <rect x="20" y="64" width="220" height="34" rx="9" fill="#2f5bd8" fill-opacity="0.35" stroke="#5a8bff" stroke-opacity="0.6"/>
      <text x="34" y="86">DJI_…_0022_D.MP4</text><text x="226" y="86" text-anchor="end" fill="#8fb0ff">7:40</text>
      <rect x="20" y="106" width="150" height="34" rx="9" fill="#2f5bd8" fill-opacity="0.35" stroke="#5a8bff" stroke-opacity="0.6"/>
      <text x="34" y="128">…_0023_D.MP4</text>
      <rect x="20" y="148" width="96" height="30" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="4 4"/>
      <text x="32" y="168" fill="#7f8aa0">3초 클립</text>
      <text x="128" y="168" fill="#e5a35a" font-family="Pretendard, 'Apple SD Gothic Neo', sans-serif" font-size="12">자동 제외</text>
    </g>
  </g>

  <!-- 고글 녹화 -->
  <g transform="translate(40 290)">
    <rect width="260" height="70" rx="18" fill="#2fbf71" fill-opacity="0.08" stroke="#3ddc84" stroke-opacity="0.4"/>
    <text x="20" y="30" fill="#bff0d3" font-size="15" font-weight="700">고글 녹화 (Goggles 3)</text>
    <text x="20" y="52" fill="#8fbfa3" font-size="13">촬영 시각 + 화면 상관으로 자동 맞춤</text>
  </g>

  <path d="M306 174 H346" stroke="#5a8bff" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2. 병합 -->
  <g transform="translate(356 76)">
    <rect width="290" height="196" rx="20" fill="url(#card)" stroke="#fff" stroke-opacity="0.12"/>
    <g transform="translate(22 30)">
      <rect width="98" height="30" rx="6" fill="#5a8bff" fill-opacity="0.55"/>
      <rect x="98" width="98" height="30" rx="0" fill="#5a8bff" fill-opacity="0.45"/>
      <rect x="196" width="50" height="30" rx="6" fill="#5a8bff" fill-opacity="0.35"/>
      <line x1="98" y1="-6" x2="98" y2="36" stroke="#ffd23f" stroke-width="2"/>
      <line x1="196" y1="-6" x2="196" y2="36" stroke="#ffd23f" stroke-width="2"/>
    </g>
    <text x="22" y="98" fill="#f4f6fb" font-size="18" font-weight="700">재압축 없이 이어붙이기</text>
    <text x="22" y="124" fill="#aab4c6" font-size="14">7:40 자동 분할 · 이어 찍은 클립 판단</text>
    <text x="22" y="146" fill="#aab4c6" font-size="14">이음매 앞뒤 프레임 비교로 확인</text>
    <g transform="translate(22 160)">
      <rect width="168" height="26" rx="13" fill="#2fbf71" fill-opacity="0.16"/>
      <text x="14" y="18" fill="#9fe6bf" font-size="13" font-weight="600">✓ 프레임 수 검증</text>
    </g>
  </g>

  <path d="M652 174 H692" stroke="#5a8bff" stroke-width="3" marker-end="url(#arr)"/>
  <path d="M306 325 C 520 325, 600 300, 690 250" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrG)"/>

  <!-- 3. 합성 -->
  <g transform="translate(702 76)">
    <rect width="280" height="196" rx="20" fill="url(#card)" stroke="#fff" stroke-opacity="0.12"/>
    <g transform="translate(22 22)">
      <rect width="236" height="100" rx="10" fill="#26467e"/>
      <rect y="62" width="236" height="38" rx="0" fill="#2c3b2a"/>
      <rect y="88" width="236" height="12" fill="#000" fill-opacity="0.7"/>
      <text x="118" y="98" fill="#fff" font-size="9" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" opacity="0.85">OSD  12.1V  ▲ 68m  ◀ 210m  02:14</text>
      <circle cx="28" cy="58" r="18" fill="#3577d4"/><path d="M10 60 A18 18 0 0 0 46 56 Z" fill="#7a4e26"/><circle cx="28" cy="58" r="18" fill="none" stroke="#fff" stroke-width="1.5"/>
      <circle cx="72" cy="58" r="18" fill="#0f1218" fill-opacity="0.75" stroke="#fff" stroke-width="1.5"/>
      <path d="M72 46 L78 64 L72 60 L66 64 Z" fill="#ffd23f"/>
      <circle cx="208" cy="58" r="18" fill="#0f1218" fill-opacity="0.75" stroke="#fff" stroke-width="1.5"/>
      <path d="M196 66 C 202 50, 214 70, 220 52" fill="none" stroke="#4fd1ff" stroke-width="2"/>
    </g>
    <text x="22" y="148" fill="#f4f6fb" font-size="18" font-weight="700">비행 데이터로 HUD 그리기</text>
    <text x="22" y="172" fill="#aab4c6" font-size="14">위젯 12종 · 테마 15종 · 끌어서 배치</text>
  </g>

  <path d="M988 174 H1028" stroke="#5a8bff" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 4. 완성 -->
  <g transform="translate(1038 76)">
    <rect width="204" height="196" rx="20" fill="#2f5bd8" fill-opacity="0.16" stroke="#5a8bff" stroke-opacity="0.5"/>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13">
      <text x="20" y="44" fill="#f4f6fb">*_merged.MP4</text>
      <text x="20" y="72" fill="#f4f6fb">*_hud.MP4</text>
      <text x="20" y="100" fill="#f4f6fb">*_goggles.MP4</text>
    </g>
    <text x="20" y="136" fill="#aab4c6" font-size="13">2_ready/ 폴더에 저장</text>
    <g transform="translate(20 152)">
      <rect width="164" height="28" rx="14" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-dasharray="4 4"/>
      <text x="82" y="19" fill="#aab4c6" font-size="13" text-anchor="middle">YouTube 업로드 (선택)</text>
    </g>
  </g>

  <text x="702" y="312" fill="#7f8aa0" font-size="14">모든 단계가 브라우저 안에서 실행됩니다 (WebCodecs · File System Access).</text>
  <text x="702" y="336" fill="#7f8aa0" font-size="14">"모두 처리" 한 번이면 쌓인 비행을 차례로 끝냅니다.</text>
</svg>
