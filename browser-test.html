<!doctype html>
<meta charset="utf-8" />
<title>browser test</title>
<pre id="out">running…</pre>
<script type="module">
  // 개발용: pnpm dev 후 /browser-test.html — 실제 DJI 파일로 브라우저 경로(프레임 추출, File 기반 병합) 검증
  import { grayFrame } from "/src/media.ts";
  import { continuity } from "/src/sim.ts";
  import { merge, parse } from "/src/mp4.ts";
  // 테스트 영상 폴더: ?dir=/절대/경로 (한 번 주면 기억). vite 는 DJI_TEST_DIR 환경 변수 폴더도 읽기 허용
  const base = (() => { const q = new URLSearchParams(location.search).get("dir"); if (q) localStorage.setItem("djiTestDir", q); const d = q ?? localStorage.getItem("djiTestDir"); if (!d) throw new Error("?dir=/absolute/path/to/footage 로 테스트 영상 폴더를 지정하세요"); return "/@fs" + d.replace(/\/$/, "") + "/"; })();
  const file = async (n) => new File([await (await fetch(base + n)).blob()], n);
  const reader = (f) => ({ size: f.size, read: async (o, l) => new Uint8Array(await f.slice(o, o + l).arrayBuffer()) });
  const out = [];
  const show = () => (document.getElementById("out").textContent = out.join("\n"));
  try {
    for (const [a, b] of [
      ["DJI_20261030173918_0018_D.LRF", "DJI_20261030173932_0019_D.LRF"],
      ["DJI_20261030173932_0019_D.LRF", "DJI_20261030174258_0020_D.LRF"],
    ]) {
      const s = continuity(await grayFrame(await file(a), "last"), await grayFrame(await file(b), "first"));
      show(); out.push(`sim ${a.slice(4, 18)}>${b.slice(4, 18)} ${s.score.toFixed(3)}`);
    }
    out.push("merging…"); show();
    const fs = [await file("DJI_20261030173918_0018_D.MP4"), await file("DJI_20261030173932_0019_D.MP4")];
    const parts = [];
    const r = await merge(fs.map(reader), { write: async (c) => parts.push(c.slice()) });
    const blob = new File(parts, "m.mp4");
    const t = await parse(reader(blob));
    out.push(`merge size ${blob.size}==${r.size} dur ${t.duration.toFixed(3)} samples ${t.count}`);
    const v = document.createElement("video");
    v.src = URL.createObjectURL(blob);
    await new Promise((ok, err) => { v.onloadedmetadata = ok; v.onerror = () => err(new Error("video error")); });
    out.push(`video plays: duration ${v.duration.toFixed(3)} ${v.videoWidth}x${v.videoHeight}`);
    out.push("DONE");
  } catch (e) {
    out.push("ERROR " + e);
  }
  document.getElementById("out").textContent = out.join("\n");
</script>
